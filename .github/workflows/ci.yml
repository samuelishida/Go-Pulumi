name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    env:
      REPO_LC: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        run: echo "REPO_LC=${REPO_LC,,}" >> "$GITHUB_ENV"

      - name: Run CI (test, build)
        env:
          SKIP_PUSH: 1
        run: |
          bash scripts/bootstrap.sh
          IMAGE="ghcr.io/${REPO_LC}/echo-service:${GITHUB_SHA}" bash scripts/ci.sh

      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${REPO_LC}/echo-service:${GITHUB_SHA}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" "ghcr.io/${REPO_LC}/echo-service:${GITHUB_REF_NAME}"
          docker push "ghcr.io/${REPO_LC}/echo-service:${GITHUB_REF_NAME}"

      - name: Job summary
        run: |
          echo "### CI result" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`ghcr.io/${REPO_LC}/echo-service:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pushed: ${{ github.event_name == 'push' }}" >> "$GITHUB_STEP_SUMMARY"